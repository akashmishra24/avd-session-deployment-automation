      - name: Assign Users to Application Group (via REST)
        run: |
          echo "=== Assigning users to application group (using az rest) ==="

          if [ -z "$APP_GROUP_NAME" ]; then
            echo "ERROR: APP_GROUP_NAME is not set. Set 'app_group_name' in deployment-vars.json"; exit 1
          fi

          # Parse user names and vm names (we validate counts to keep 1:1 mapping)
          USER_NAMES_CLEAN=$(echo "$USER_NAMES" | sed "s/^'//;s/'$//")
          VM_NAMES_CLEAN=$(echo "$VM_NAMES" | sed "s/^'//;s/'$//")

          mapfile -t user_array < <(echo "$USER_NAMES_CLEAN" | jq -r '.[]')
          mapfile -t vm_array < <(echo "$VM_NAMES_CLEAN" | jq -r '.[]')

          if [ ${#user_array[@]} -ne ${#vm_array[@]} ]; then
            echo "ERROR: Number of users (${#user_array[@]}) does not match number of VMs (${#vm_array[@]})"; exit 1
          fi

          # Get subscription id
          SUB_ID=$(az account show --query id -o tsv)
          if [ -z "$SUB_ID" ]; then
            echo "ERROR: Failed to obtain subscription id"; exit 1
          fi

          API_VERSION="2023-09-30"

          for i in "${!user_array[@]}"; do
            user="${user_array[$i]}"
            vm="${vm_array[$i]}"
            echo "Adding user '$user' to application group '$APP_GROUP_NAME' (VM mapping: $vm)"

            # URL-encode user for resource name
            encoded_user=$(printf '%s' "$user" | jq -sRr @uri)

            uri="/subscriptions/${SUB_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.DesktopVirtualization/applicationGroups/${APP_GROUP_NAME}/users/${encoded_user}?api-version=${API_VERSION}"

            body=$(jq -n --arg upn "$user" '{properties: {userPrincipalName: $upn}}')

            az rest --method put --uri "$uri" --body "$body" --output json || {
              echo "WARNING: REST call to add user '$user' failed. Continuing..."
            }
          done

          echo "Application group REST user assignment complete"
 
      - name: Azure CLI logout
        if: always()
        run: |
          az logout
          az cache purge
          az account clear