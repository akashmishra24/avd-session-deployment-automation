name: AVD Session Host Deployment
 
on:
  workflow_dispatch:  # Manual trigger for testing
    inputs:
      vars_file:
        description: 'Path to JSON variables file in the repository'
        required: true
        default: 'deployment-vars.json'
 
jobs:
  deploy-avd-sessionhost:
    runs-on: ubuntu-latest
 
    permissions:
      id-token: write    # REQUIRED for OIDC
      contents: read
 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          echo "Installing jq"
          sudo apt-get update && sudo apt-get install -y jq
      - name: Load deployment variables
        run: |
          echo "=== Loading variables from ${{ github.event.inputs.vars_file }} ==="
          file="$GITHUB_WORKSPACE/${{ github.event.inputs.vars_file }}"
          if [ ! -f "$file" ]; then
            echo "ERROR: variables file not found at $file"; exit 1
          fi

          # Emit uppercase keys with JSON-encoded values to a temp file
          jq -r 'to_entries[] | "\(.key|ascii_upcase)=\(.value|@json)"' "$file" > /tmp/vars_jq.txt

          # Read and normalize JSON values, then write to GITHUB_ENV
          while IFS='=' read -r key val; do
            # If val is a JSON string (quoted), strip surrounding quotes and unescape
            if echo "$val" | grep -qE '^".*"$'; then
              # remove leading/trailing quote
              val=$(echo "$val" | sed -E 's/^"(.*)"$/\1/')
              # unescape common sequences
              val=$(echo -e "$(echo "$val" | sed 's/\\"/"/g; s/\\n/\\n/g')")
            fi
            printf "%s=%s\n" "$key" "$val" >> "$GITHUB_ENV"
          done < /tmp/vars_jq.txt

      - name: Debug loaded variables (non-sensitive)
        run: |
          echo "--- Loaded variables ---"
          echo "RESOURCE_GROUP=$RESOURCE_GROUP"
          echo "VNET_NAME=$VNET_NAME"
          echo "SUBNET_NAME=$SUBNET_NAME"
          echo "LOCATION=$LOCATION"
          echo "HOSTPOOL_NAME=$HOSTPOOL_NAME"
          # show VM names (may be JSON array)
          echo "VM_NAMES=$VM_NAMES"

      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure CLI AVD extension
        run: |
          echo "=== Installing/updating desktopvirtualization extension ==="
          az config set extension.use_dynamic_install=no
          az extension add --name desktopvirtualization --yes 2>/dev/null || az extension update --name desktopvirtualization || true
          echo "Installed extensions:"
          az extension list --output table
 
      - name: Verify Azure CLI context
        run: |
          echo "=== Azure Account Info ==="
          az account show --output table
          echo ""
          echo "=== Resource Groups ==="
          az group list --output table
 
