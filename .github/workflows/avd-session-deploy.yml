      #       exit 1
      #     fi
          
      #     echo "Domain password retrieved successfully"
      #     echo "DOMAIN_PASSWORD=$DOMAIN_PASSWORD" >> $GITHUB_ENV
      
      # - name: Join VMs to Domain
      #   run: |
      #     echo "=== Joining VMs to domain: $DOMAIN_NAME ==="
          
      #     if [ -z "$DOMAIN_USERNAME" ] || [ -z "$DOMAIN_PASSWORD" ]; then
      #       echo "ERROR: Domain credentials are not available"
